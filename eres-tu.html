<style>

.mine { text-align: center; font-weight: 800; font-size: 1.2rem; }

.center { text-align: center; }

.tvbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
select { font: inherit; background: var(--surface2); color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.addname { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.dot.on { background: var(--good); }
a { color: var(--accent); }

/* Pantalla grande */

body.tv .brand { font-size: clamp(1.6rem, 3vw, 2.6rem); }

body.tv .chip { font-size: clamp(1.3rem, 2.6vw, 2.4rem); padding: 10px 24px; }
body.tv .bar { height: 16px; }
body.tv .res { grid-template-columns: repeat(2, 1fr); }
body.tv .row .top { font-size: clamp(1.3rem, 2.4vw, 2.2rem); }
body.tv .podium .p { font-size: clamp(1.4rem, 2.6vw, 2.4rem); }
body.tv .podium .p.first { font-size: clamp(2rem, 4vw, 3.6rem); }
body.tv .url { font-family: var(--f-hand); color: var(--accent); font-size: clamp(1.6rem, 3.4vw, 3.2rem); word-break: break-all; }
@media (max-width: 640px) { body.tv .res { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .row .fill, .bar > i { transition: none; } }
</style>

  var header = '<div class="brand"><span>¿Quién es más probable?</span><small>Los Sin Nombres</small></div>';

  /* ====================== PANTALLA GRANDE (anfitrión) ====================== */
  function runTV() {
    var players = {}, S = { phase: "lobby", round: 0, total: 10 }, deadline = 0, votes = {}, scores = {}, names = {}, qs = [], tReveal = null, tNext = null, lastKey = "";

  /* ====================== CELULAR (jugador) ====================== */
  function runPlayer() {

      });
    }
    document.addEventListener("visibilitychange", function () { if (!document.hidden && ch && connected) ch.send({ type: "broadcast", event: "hello", payload: { slug: me } }); });

    function onState(p) {
      var key = p.phase + "|" + p.round;
      var changed = key !== (S.phase + "|" + S.round);
      S = p; deadline = Date.now() + (p.left || 0);
      if (changed || keyDrawn === "") draw(); else live();
    }
    function vote(choice) {
      if (S.phase !== "question" || Date.now() > deadline) return;
      myVote[S.round] = choice; ch.send({ type: "broadcast", event: "vote", payload: { slug: me, name: myName, round: S.round, choice: choice } });
      [].forEach.call(document.querySelectorAll(".opt"), function (b) { b.classList.toggle("sel", b.getAttribute("data-s") === choice); });
      var m = document.getElementById("mv"); if (m) m.textContent = "Tu voto quedó registrado. Puedes cambiarlo hasta que termine el tiempo.";
    }
    function live() {
      var b = document.getElementById("tb");
      if (b && S.phase === "question") { var total = Math.max(1, S.qtime || QTIME); b.style.width = Math.max(0, Math.min(100, (deadline - Date.now()) / 1000 / total * 100)) + "%"; }
      var t = document.getElementById("tt"); if (t && S.phase === "question") t.textContent = Math.max(0, Math.ceil((deadline - Date.now()) / 1000)) + " s";
      var v = document.getElementById("vd"); if (v) v.textContent = (S.voted || 0) + " votos";
    }
    setInterval(function () { if (S.phase === "question") live(); }, 250);

    function rankOf() { var sc = S.scores || {}, mine = sc[me] || 0, arr = Object.keys(sc); return { pos: arr.filter(function (s) { return sc[s] > mine; }).length + 1, pts: mine, n: arr.length }; }
    function draw() {
      if (!me || !myName) { pickScreen(); return; }
      keyDrawn = S.phase + "|" + S.round;
      var hi = header + '<div class="meta"><span>' + esc(myName) + '</span><span><span class="dot' + (connected ? " on" : "") + '"></span>' + (connected ? "Conectado" : "Conectando...") + '</span></div>';
      if (S.phase === "lobby") {
        $app.innerHTML = hi + '<div class="card center"><h2>Hola, ' + esc(myName) + '</h2><p class="dim">Ya estás en la sala. Espera a que el anfitrión empiece el juego y mira la pantalla grande.</p></div><div class="center"><button class="btn" id="chg">No soy ' + esc(myName) + '</button></div>';
        document.getElementById("chg").onclick = function () { try { localStorage.removeItem("sn_me"); } catch (e) {} if (ch) sb.removeChannel(ch); me = null; myName = null; S = { phase: "lobby" }; pickScreen(); };
        return;
      }
      if (S.phase === "question") {
        var mine = myVote[S.round];
        $app.innerHTML = hi + '<div class="meta"><span>Pregunta ' + S.round + ' de ' + S.total + '</span><span id="tt"></span></div><div class="bar"><i id="tb"></i></div><div class="q">' + esc(S.q) + '</div><div class="names">' + S.options.map(function (o) { return '<button class="opt' + (mine === o.slug ? " sel" : "") + '" data-s="' + esc(o.slug) + '">' + esc(o.name) + '</button>'; }).join("") + '</div><p class="dim center" id="mv">' + (mine ? "Tu voto quedó registrado. Puedes cambiarlo hasta que termine el tiempo." : "Vota por una persona.") + '</p><p class="dim center"><span id="vd"></span></p>';
        [].forEach.call(document.querySelectorAll(".opt"), function (b) { b.onclick = function () { vote(b.getAttribute("data-s")); }; });
        live(); return;
      }
      if (S.phase === "reveal") {
        var win = S.winners || [], names = S.options.filter(function (o) { return win.indexOf(o.slug) > -1; }).map(function (o) { return o.name; });
        var got = S.gained && S.gained[me], voted = S.votedBy && S.votedBy[me], r = rankOf();
        $app.innerHTML = hi + '<div class="meta"><span>Pregunta ' + S.round + ' de ' + S.total + '</span><span>Resultados</span></div><div class="q">' + esc(S.q) + '</div><div class="card center"><p class="dim">' + (names.length > 1 ? "Empate" : "Más votado") + '</p><h2>' + (names.length ? names.map(esc).join(" y ") + " 👑" : "Nadie votó") + '</h2></div><div class="mine ' + (got ? "ok" : "no") + '">' + (got ? "¡Coincidiste con el grupo! +" + got + " puntos" : (voted ? "Esta vez no coincidiste" : "No alcanzaste a votar")) + '</div><p class="dim center">Llevas ' + r.pts + ' puntos' + (r.pos ? ' · puesto ' + r.pos + ' de ' + r.n : '') + '</p>';
        return;
      }
      if (S.phase === "final") {
        var rk = S.rank || [], i = -1; rk.forEach(function (x, k) { if (x.slug === me) i = k; });
        var posOf = function (x) { return 1 + rk.filter(function (y) { return y.score > x.score; }).length; };
        $app.innerHTML = hi + '<h2 class="center">¡Fin del juego!</h2><div class="podium">' + rk.filter(function (x) { return posOf(x) <= 3; }).map(function (x) { var pos = posOf(x); return '<div class="p' + (pos === 1 ? " first" : "") + '"><span class="n">' + pos + '</span><span>' + esc(x.name) + (pos === 1 ? " 🏆" : "") + '</span><span class="s">' + x.score + '</span></div>'; }).join("") + '</div><div class="card center">' + (i >= 0 ? "Terminaste en el puesto " + posOf(rk[i]) + " con " + rk[i].score + " puntos." : "Gracias por jugar.") + '</div>';
      }
    }
    if (me && myName) join(); else pickScreen();
  }

  if (TV) runTV(); else runPlayer();
})();
</script>
</body>
</html>
