      if (S.phase === "question") {
        var mine = myVote[S.round];
        $app.innerHTML = hi + '<div class="meta"><span>Pregunta ' + S.round + ' de ' + S.total + '</span><span id="tt"></span></div><div class="bar"><i id="tb"></i></div><div class="q">' + esc(S.q) + '</div><div class="names">' + S.options.map(function (o) { return '<button class="opt' + (mine === o.slug ? " sel" : "") + '" data-s="' + esc(o.slug) + '"' + (S.open ? "" : " disabled") + '>' + esc(o.name) + '</button>'; }).join("") + '</div><p class="dim center" id="mv">' + (!S.open ? "Escucha la pregunta en la pantalla grande. Podrás votar en un momento." : mine ? "Tu voto quedó registrado. Puedes cambiarlo hasta que termine el tiempo." : "Vota por una persona.") + '</p><p class="dim center"><span id="vd"></span></p>';
        [].forEach.call(document.querySelectorAll(".opt"), function (b) { b.onclick = function () { vote(b.getAttribute("data-s")); }; });
        live(); return;
      }
      if (S.phase === "reveal") {
        var win = S.winners || [], names = S.options.filter(function (o) { return win.indexOf(o.slug) > -1; }).map(function (o) { return o.name; });
        var got = S.gained && S.gained[me], voted = S.votedBy && S.votedBy[me], r = rankOf();
        $app.innerHTML = hi + '<div class="meta"><span>Pregunta ' + S.round + ' de ' + S.total + '</span><span>Resultados</span></div><div class="q">' + esc(S.q) + '</div><div class="card center"><p class="dim">' + (names.length > 1 ? "Empate" : "Más votado") + '</p><h2>' + (names.length ? names.map(esc).join(" y ") + " 👑" : "Nadie votó") + '</h2></div><div class="mine ' + (got ? "ok" : "no") + '">' + (got ? "¡Coincidiste con el grupo! +" + got + " puntos" : (voted ? "Esta vez no coincidiste" : "No alcanzaste a votar")) + '</div><p class="dim center">Llevas ' + r.pts + ' puntos' + (r.pos ? ' · puesto ' + r.pos + ' de ' + r.n : '') + '</p>';
        return;
      }
      if (S.phase === "final") {
        var rk = S.rank || [], i = -1; rk.forEach(function (x, k) { if (x.slug === me) i = k; });
        var posOf = function (x) { return 1 + rk.filter(function (y) { return y.score > x.score; }).length; };
        $app.innerHTML = hi + '<h2 class="center">¡Fin del juego!</h2><div class="podium">' + rk.filter(function (x) { return posOf(x) <= 3; }).map(function (x) { var pos = posOf(x); return '<div class="p' + (pos === 1 ? " first" : "") + '"><span class="n">' + pos + '</span><span>' + esc(x.name) + (pos === 1 ? " 🏆" : "") + '</span><span class="s">' + x.score + '</span></div>'; }).join("") + '</div><div class="card center">' + (i >= 0 ? "Terminaste en el puesto " + posOf(rk[i]) + " con " + rk[i].score + " puntos." : "Gracias por jugar.") + '</div>';
      }
    }
    if (me && myName) join(); else pickScreen();
  }

  /* Candado de cortesia del juego sorpresa (solo huella de la clave; el mismo que usa la pagina principal) */
  var KEY_HASH = 6860280117649515;
  function cyrb53(str) { var h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (var i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); }
  function normKey(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, ""); }
  function isUnlocked() { try { return localStorage.getItem("sn_unlock") === String(KEY_HASH); } catch (e) { return false; } }
  function lockScreen() {
    $app.innerHTML = header + '<div class="card center"><h2>🔒 Juego sorpresa</h2><p class="dim">Se presenta el sábado 31. Cuando llegue el momento, el Líder supremo dirá la clave.</p><div class="addname"><input type="text" id="k" maxlength="30" placeholder="Clave" autocomplete="off" autocapitalize="none" aria-label="Clave"><button class="btn primary" id="kb">Desbloquear</button></div><p class="dim" id="km" aria-live="polite"></p></div>';
    function go() {
      var v = normKey(document.getElementById("k").value);
      if (!v) return;
      if (cyrb53(v) !== KEY_HASH) { document.getElementById("km").textContent = "Esa no es la clave."; return; }
      try { localStorage.setItem("sn_unlock", String(KEY_HASH)); } catch (e) {}
      location.reload();
    }
    document.getElementById("kb").onclick = go;
    document.getElementById("k").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
  }

  if (!isUnlocked()) lockScreen(); else if (TV) runTV(); else runPlayer();
})();
</script>
